<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;background:#0b0b0c;color:#f6f3ec;font-family:"Helvetica Neue Condensed","Arial Narrow",system-ui,sans-serif}
  .page{position:relative;width:390px;height:844px;overflow:hidden;padding:0 20px;box-sizing:border-box}
  .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #f6f3ec;padding:22px 0 8px}
  .mast b{font-size:44px;letter-spacing:-.02em;font-weight:900}
  .mast span{font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .burst{position:absolute;right:16px;top:118px;width:118px;height:118px;background:#ffe11a;color:#0b0b0c;display:grid;place-items:center;font-weight:900;font-size:20px;transform:rotate(-12deg);clip-path:polygon(50% 0,61% 14%,79% 6%,82% 24%,100% 27%,92% 44%,100% 61%,83% 67%,82% 86%,63% 82%,50% 100%,38% 83%,19% 92%,16% 72%,0 62%,10% 46%,0 29%,18% 24%,21% 6%,39% 15%)}
  h1{margin:170px 0 0;font-size:76px;line-height:.9;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
  .dek{margin-top:26px;font-size:22px;line-height:1.15;font-weight:700}
  .dek em{font-style:normal;background:#ffe11a;color:#0b0b0c;padding:0 4px}
  .foot{position:absolute;left:20px;right:20px;bottom:26px;border-top:1px solid #444;padding-top:10px;font-size:14px;color:#b9b5ad}
</style></head><body>
<div class="page">
  <div class="mast"><b>STORY</b><span>Spätausgabe</span></div>
  <div class="burst">EXKLUSIV</div>
  <h1>Ich muss dir kurz was zeigen.</h1>
  <p class="dek"><em>Insider verrät:</em> Hatte Langeweile.</p>
  <div class="foot">Ganz nach unten scrollen? Sen yapamasin.</div>
</div>
</body></html>
